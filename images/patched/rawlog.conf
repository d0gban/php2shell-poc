# Lab raw-HTTP capture for WAF rule development. OBSERVABILITY ONLY — it does not
# change PHP behaviour or the vulnerability. Delete this file (or drop the dumpio
# module) for a pure-fingerprint run.
#
# mod_dumpio writes the raw request + response bytes to the error log; the custom
# access log adds a parsed one-line-per-request summary. With ./logs/<role>
# mounted at /var/log/apache2, both land on the host for per-version comparison.
LogLevel dumpio:trace7
DumpIOInput On
DumpIOOutput On
ErrorLog /var/log/apache2/error.log
LogFormat "%h %{%Y-%m-%dT%H:%M:%S}t \"%r\" %>s %b ct=\"%{Content-Type}i\" len=%{Content-Length}i ua=\"%{User-Agent}i\" xff=\"%{X-Forwarded-For}i\"" labcap
CustomLog /var/log/apache2/lab_capture.log labcap
