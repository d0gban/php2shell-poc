# Lab raw-HTTP capture for WAF rule development. OBSERVABILITY ONLY — it does not
# change PHP behaviour or the vulnerability. Delete this file for a pure run.
#
# Always-on: a detailed one-line-per-request access log + the error log, written
# to /var/log/apache2 (mount ./logs/<role> there to collect them on the host).
ErrorLog /var/log/apache2/error.log
LogFormat "%h %{%Y-%m-%dT%H:%M:%S}t \"%r\" %>s %b ct=\"%{Content-Type}i\" len=%{Content-Length}i ua=\"%{User-Agent}i\" xff=\"%{X-Forwarded-For}i\"" labcap
CustomLog /var/log/apache2/lab_capture.log labcap

# Optional: raw request + response BODY bytes via mod_dumpio. Self-loaded here so
# we don't depend on a2enmod having a dumpio.load. Guarded so the build and
# Apache startup NEVER fail when the module is absent — you simply fall back to
# the access log above.
<IfFile "/usr/lib/apache2/modules/mod_dumpio.so">
    <IfModule !dumpio_module>
        LoadModule dumpio_module /usr/lib/apache2/modules/mod_dumpio.so
    </IfModule>
</IfFile>
<IfModule dumpio_module>
    LogLevel dumpio:trace7
    DumpIOInput On
    DumpIOOutput On
</IfModule>
