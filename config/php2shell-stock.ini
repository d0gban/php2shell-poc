; php2shell-stock.ini — the "stock" config profile (setup.sh --stock).
;
; Intentionally EMPTY of directives: mounted in place of php2shell-tune.ini so the
; container runs on the unmodified php.ini-production baseline the image ships with.
; Use it to show the stock fingerprint, then re-run with the default (--tuned)
; profile to see config/php2shell-tune.ini weaken the same directives — the
; Current-config column in /assess.php changes between the two runs.
;
; (A conf.d file with no directives is a no-op; this file exists only so the
;  docker-compose mount has a valid source in the --stock profile.)
