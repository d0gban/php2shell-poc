; php2shell-stock.ini — the "stock" config profile (setup.sh --stock).
;
; Goal: run the lab on the genuine php.ini-production baseline that ships inside
; php:8.4.26-apache — NOT the weakened php2shell-tune.ini. Use this profile for
; the PHP2Shell exploit repro (the PoC was built against stock production config).
;
; This file reproduces php.ini-production's values for every directive the lab
; audits (see /assess.php), so the "Current config" column shows true production
; values under --stock. For the BYTE-EXACT upstream php.ini-production (all ~1900
; lines) run:   bash config/fetch-stock-ini.sh   (needs Docker; pulls it from the
; pinned OLD_TAG image and overwrites this file).
;
; Required production values (verified against php.ini-production):
;   memory_limit = 128M · post_max_size = 8M · display_errors = Off
;   session.upload_progress.enabled = On

engine = On
expose_php = On

max_execution_time = 30
max_input_time = 60
memory_limit = 128M

error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On

post_max_size = 8M
default_charset = "UTF-8"

file_uploads = On
upload_max_filesize = 2M
max_file_uploads = 20

session.save_handler = files
session.use_strict_mode = 0
session.use_cookies = 1
session.use_only_cookies = 1
session.gc_maxlifetime = 1440
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
