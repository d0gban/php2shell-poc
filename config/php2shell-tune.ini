; php2shell-tune.ini — lab runtime config, matched across the 3 lab hosts.
;
; LAB — DELIBERATELY WEAKENED. Loaded into /usr/local/etc/php/conf.d/ on every
; container (see docker-compose.yml), so it OVERRIDES the php.ini-production
; baseline the images ship with. The point is to present the real exposure
; preconditions on an authentic runtime for WAF/detection/remediation work —
; it mirrors prod-gone-wrong, it does not harden. assess.php audits each line
; against the hardened ("patched") target.
;
;   display_errors/*            -> leaks path/LFI/SQL errors to the client
;   memory_limit = 8M           -> tight; relevant to the CVE-2026-109618 OOM path
;   session.use_strict_mode = 0 -> app adopts attacker-chosen session ids (fixation)
;   session.upload_progress.*   -> the PHP2Shell upload_progress write vector left on
;
; Remediation targets: docs/remediation.md, docs/session-fixation-remediation.md.

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
memory_limit = 8M
post_max_size = 64M
upload_max_filesize = 64M
max_input_vars = 1000
session.use_cookies = 1
session.use_strict_mode = 0
session.upload_progress.enabled = 1
session.upload_progress.cleanup = 1
