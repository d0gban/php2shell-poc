# mpm-prefork.conf — Apache prefork MPM, SINGLE worker, for the PHP2Shell exploit repro.
#
# Mounted into every container's /etc/apache2/conf-enabled/ (see docker-compose.yml),
# loaded after mods-enabled/mpm_prefork.conf so these values win. MaxRequestWorkers
# is an APACHE MPM setting, not a php.ini directive — it cannot live in php*.ini.
#
# Why single-worker:
#   - php:*-apache runs mod_php under the prefork MPM (mod_php needs prefork).
#   - The PHP2Shell PoC (9bie / OffSec, for 8.4.26 / mod_php) REQUIRES a single
#     prefork worker: its staged heap-leak chain (stage 0 worker rotation ->
#     Set-Cookie Zend-MM leak -> libphp leak -> upload_progress fake-ref) must land
#     every request on the SAME long-lived process with a stable address space.
#     Multiple workers scatter the requests across address spaces and break it.
#   - MaxConnectionsPerChild 0 = the worker is NEVER recycled, so its heap / address
#     space persists across the attacker's staged requests.
#   - ServerLimit 1 caps the pool at exactly one process.
#
# For a many-worker scenario instead (worker-pinning / connection-holding tests),
# raise MaxRequestWorkers + ServerLimit (e.g. 150) — but that is NOT the PoC's model.
<IfModule mpm_prefork_module>
    StartServers              1
    MinSpareServers           1
    MaxSpareServers           1
    ServerLimit               1
    MaxRequestWorkers         1
    MaxConnectionsPerChild    0
</IfModule>
