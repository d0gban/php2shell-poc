# mpm-prefork.conf — Apache prefork MPM model for the PHP2Shell worker-reuse repro.
#
# Mounted into every container's /etc/apache2/conf-enabled/ (see docker-compose.yml),
# loaded after mods-enabled/mpm_prefork.conf so these values win. MaxRequestWorkers
# is an APACHE MPM setting, not a php.ini directive — it cannot live in php*.ini.
#
# Why these values:
#   - php:*-apache runs mod_php under the prefork MPM (mod_php needs prefork).
#   - MaxRequestWorkers 150 matches the official Apache prefork default / the model
#     the PHP2Shell PoC (9bie) targets via connection-holding / worker pinning.
#   - MaxConnectionsPerChild 0 = worker processes are NEVER recycled, so per-worker
#     request-owned global state persists across requests — exactly the condition
#     CVE-2026-109619 ("stale request-owned global state reused by a later request
#     on the same worker") relies on. Set a non-zero value to harden.
#   - ServerLimit (default 256) stays >= MaxRequestWorkers, so 150 needs no bump.
#
# For a simpler, deterministic single-worker repro, set MaxRequestWorkers 1 and
# ServerLimit 1 instead (note: that is not the "official prefork 150" scenario).
<IfModule mpm_prefork_module>
    StartServers              5
    MinSpareServers           5
    MaxSpareServers          10
    MaxRequestWorkers       150
    MaxConnectionsPerChild    0
</IfModule>
