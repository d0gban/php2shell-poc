# =============================================================================
# php2shell-virtual-patch.conf
# ModSecurity (SecLang) virtual-patch / shielding rules for PHP2Shell
# (CVE-2026-109618 / CVE-2026-109619).
#
# PURPOSE
#   For hosts that CANNOT upgrade PHP right now, this shields the HTTP-layer
#   attack surface at the reverse proxy / WAF. It is a stopgap (virtual patch),
#   NOT a fix — patching the PHP runtime is the only complete remedy (Sansec,
#   Datadog). Both advisories also note the primitive runs INSIDE PHP before
#   application code, so treat these rules as defense-in-depth, not a guarantee.
#
# WHAT THEY KEY ON  (all HTTP-observable, all from the public advisories)
#   - multipart/form-data POSTs to PHP  (Sansec: every known trigger uses this
#     content type)  ................................................ rule 1000100/110
#   - the PHP_SESSION_UPLOAD_PROGRESS field  (session.upload_progress vector,
#     CVE-2026-109619)  ............................................. rule 1000120
#   - oversized bodies / a single huge field or field name  (Sansec IOC)  . 1000130
#   - requests with no usable Content-Length but a large decoded body  ... 1000140
#
# DEPLOY SAFELY
#   1. Start in DetectionOnly (SecRuleEngine DetectionOnly) and watch the log —
#      rule 1000100 WILL match every legitimate file upload (Magento admin
#      images, checkout/cart forms, etc.). Do NOT blind-block it.
#   2. Allow-list your real upload routes with rule 1000090 before enabling
#      blocking. Then flip the upload-block rule (1000110) to a blocking action
#      only for NON-upload paths.
#   3. Pair with the PHP config mitigations in docs/waf-tuning.md
#      (session.upload_progress.enabled=0, etc.) and REMOVE these after patching.
#
# Validate with:  bash scan/waf-test.sh   (benign probes) and
#                 bash scan/behavior.sh   (per-version baseline)
# =============================================================================

# --- 1000090: allow-list legitimate upload endpoints ------------------------
# Add the paths that MUST accept multipart uploads. These skip the upload block.
SecRule REQUEST_URI "@rx ^/(admin/.*upload|checkout|media/upload|api/v[0-9]+/files)" \
    "id:1000090,phase:1,pass,nolog,ctl:ruleRemoveById=1000110,\
msg:'PHP2Shell: allow-listed upload route'"

# --- 1000100: detect multipart/form-data POST to PHP (ALWAYS log) -----------
SecRule REQUEST_METHOD "@streq POST" \
    "id:1000100,phase:1,pass,t:none,nolog,chain"
    SecRule REQUEST_HEADERS:Content-Type "@rx (?i)multipart/form-data" \
        "t:none,setvar:'tx.php2shell_multipart=1',\
log,msg:'PHP2Shell: multipart/form-data POST to PHP endpoint (review / known trigger content type)',\
tag:'CVE-2026-109618',tag:'CVE-2026-109619'"

# --- 1000110: block multipart on NON-upload routes --------------------------
# Disabled by default (pass). After allow-listing real upload routes (1000090),
# change `pass` -> `deny,status:403` to virtual-patch everything else.
SecRule TX:php2shell_multipart "@eq 1" \
    "id:1000110,phase:2,pass,t:none,\
msg:'PHP2Shell: multipart POST to non-upload route — candidate to block (edit action to deny)',\
tag:'virtual-patch'"

# --- 1000120: PHP_SESSION_UPLOAD_PROGRESS marker in the body ----------------
# The session.upload_progress vector (CVE-2026-109619). Legitimate uses exist,
# so default is log; raise to deny once you confirm your app never sends it.
SecRule REQUEST_BODY|ARGS_NAMES|MULTIPART_PART_HEADERS "@rx (?i)PHP_SESSION_UPLOAD_PROGRESS" \
    "id:1000120,phase:2,log,pass,t:none,\
msg:'PHP2Shell: PHP_SESSION_UPLOAD_PROGRESS present (session.upload_progress vector)',\
tag:'CVE-2026-109619'"

# --- 1000130: oversized single field or field name (Sansec IOC) -------------
# Flag an individual argument value or NAME far larger than any real form field.
# Tune the thresholds to your app's legitimate maximums.
SecRule ARGS "@gt 2097152" \
    "id:1000130,phase:2,log,pass,t:none,t:length,\
msg:'PHP2Shell: oversized form field value (>2MB single field)',tag:'CVE-2026-109618'"
SecRule ARGS_NAMES "@gt 1024" \
    "id:1000131,phase:2,log,pass,t:none,t:length,\
msg:'PHP2Shell: abnormally long form field NAME (>1KB)',tag:'CVE-2026-109618'"

# --- 1000140: large body with no usable Content-Length ----------------------
# Sansec: requests without a usable Content-Length that still decode to a large
# body. Chunked POSTs are legitimate, so log-only; correlate with 1000100.
SecRule REQUEST_METHOD "@streq POST" \
    "id:1000140,phase:1,pass,nolog,chain"
    SecRule &REQUEST_HEADERS:Content-Length "@eq 0" \
        "chain"
        SecRule REQUEST_HEADERS:Transfer-Encoding "@rx (?i)chunked" \
            "log,pass,msg:'PHP2Shell: chunked POST without Content-Length — review decoded body size at the proxy'"

# --- 1000200: auto-block known vuln-scanner / checker recon traffic ---------
# Answers "block public PHP checkers at the WAF". Keyed on recognisable scanner
# User-Agents (incl. this lab's vuln-checker.py). Tune the list to your estate;
# attackers can forge UAs, so this stops noisy public tooling, not a targeted
# adversary — pair it with the behaviour-based rules above.
SecRule REQUEST_HEADERS:User-Agent \
    "@rx (?i)(php2shell-vuln-checker|nikto|nuclei|whatweb|sqlmap|wpscan|zgrab|masscan|nmap|acunetix|nessus|openvas|dirbuster|gobuster|feroxbuster)" \
    "id:1000200,phase:1,deny,status:403,\
msg:'PHP2Shell: known vulnerability-scanner/checker User-Agent blocked',\
logdata:'%{MATCHED_VAR}',tag:'scanner',tag:'recon'"

# --- 1000210: block requests with no/empty User-Agent to PHP (optional) -----
# Many quick checker scripts omit a UA. Legit clients and some monitoring do too,
# so keep this DetectionOnly (pass) until you confirm it's safe for your traffic.
SecRule &REQUEST_HEADERS:User-Agent "@eq 0" \
    "id:1000210,phase:1,pass,log,\
msg:'PHP2Shell: request with no User-Agent (common for recon scripts) — review before blocking',\
tag:'scanner'"

# NOTE on CVE-2026-109619 memory disclosure: the advisories describe worker
# memory leaking back inside an abnormally long/odd PHPSESSID *response* cookie.
# Response-header inspection is engine-specific; if your WAF supports it, add a
# rule flagging Set-Cookie: PHPSESSID values far longer than 26-40 bytes.
