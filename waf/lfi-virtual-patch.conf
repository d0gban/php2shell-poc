# =============================================================================
# lfi-virtual-patch.conf
# ModSecurity (SecLang) virtual-patch / shielding rules for the Knowledge-Base
# Local File Inclusion (webapp/view.php) and the session-fixation chain.
#
# PURPOSE
#   Stopgap HTTP-layer shielding for hosts that cannot ship the code fix in
#   docs/lfi-remediation.md yet. This is a VIRTUAL PATCH, not a fix — the only
#   complete remedy is the allow-list / basename / realpath change in view.php
#   and session_regenerate_id() in login.php. Remove these once that ships.
#
# WHAT THEY KEY ON  (all HTTP-observable)
#   - path traversal in the `doc` parameter ( ../ , ..\ , encoded forms ) . 1000300
#   - PHP / data / phar stream wrappers in input  (php://, data://, phar://) 1000310
#   - absolute sensitive paths (/etc/passwd, /var/log/…, /tmp/sess_…)  .... 1000320
#   - null byte / overlong-encoding traversal evasions  ................... 1000330
#   - caller-supplied session id on the login route (?sid=, fixation)  .... 1000340
#
# DEPLOY SAFELY
#   1. Start in DetectionOnly (SecRuleEngine DetectionOnly) and watch the log.
#      Rule 1000300 can match legitimate relative links if your app uses them —
#      confirm against normal traffic in logs/<role>/ first.
#   2. Scope the rules to the real sink paths (view.php / login.php) as below so
#      they do not inspect the whole site.
#   3. Pair with the PHP config backstops in docs/lfi-remediation.md
#      (open_basedir, allow_url_include=Off) and REMOVE after the code fix.
#
# Validate with:  bash scan/waf-test.sh   (benign probes).
# =============================================================================

# --- 1000300: path traversal in the document parameter ----------------------
SecRule REQUEST_URI "@rx (?i)/view\.php" \
    "id:1000300,phase:1,pass,t:none,nolog,chain,\
msg:'LFI: traversal in doc parameter'"
    SecRule ARGS:doc "@rx (?i)(?:\.\.[/\\]|%2e%2e(?:%2f|%5c))" \
        "t:urlDecodeUni,t:normalizePath,deny,status:403,log,\
setvar:'tx.lfi_score=+5'"

# --- 1000310: stream wrappers as input (source disclosure / RCE) -------------
SecRule ARGS:doc "@rx (?i)(?:php|data|phar|expect|zip|glob):/{0,2}" \
    "id:1000310,phase:1,t:urlDecodeUni,t:lowercase,deny,status:403,log,\
msg:'LFI: stream wrapper in doc parameter'"

# --- 1000320: absolute sensitive paths --------------------------------------
SecRule ARGS:doc "@rx (?i)(?:/etc/passwd|/etc/shadow|/proc/self/environ|/var/log/|/tmp/sess_|/var/lib/php/sessions/)" \
    "id:1000320,phase:1,t:urlDecodeUni,t:normalizePath,deny,status:403,log,\
msg:'LFI: sensitive absolute path in doc parameter'"

# --- 1000330: null-byte / encoding evasions ---------------------------------
SecRule ARGS:doc "@rx (?i)(?:%00|\x00|%25|%c0%ae|%uff0e)" \
    "id:1000330,phase:1,t:none,deny,status:403,log,\
msg:'LFI: null-byte / overlong-encoding evasion in doc parameter'"

# --- 1000340: caller-supplied session id on the login route (fixation) ------
SecRule REQUEST_URI "@rx (?i)/login\.php" \
    "id:1000340,phase:1,pass,t:none,nolog,chain,\
msg:'Session fixation: caller-supplied session id'"
    SecRule ARGS:sid "@rx .+" \
        "deny,status:403,log,setvar:'tx.lfi_score=+3'"

# --- 1000350: correlated alert (any two of the above on one host) -----------
SecRule TX:lfi_score "@ge 8" \
    "id:1000350,phase:5,pass,log,\
msg:'LFI chain: multiple inclusion indicators from one client — escalate'"
